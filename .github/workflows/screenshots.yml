name: Скриншоты экранов

on:
  push:
    branches: [main, "ui/**"]
    paths: ["app/src/**", "app/build.gradle.kts", "gradle/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  record:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.8.2"

      - name: Снимки
        run: gradle :app:recordRoborazziDebug --tests 'app.farvater.ui.ScreenshotTest'

      - name: В ветку screenshots
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin screenshots; then
            git worktree add -B screenshots shots FETCH_HEAD
          else
            git worktree add --orphan -b screenshots shots
          fi
          mkdir -p "shots/$GITHUB_REF_NAME"
          rm -f "shots/$GITHUB_REF_NAME"/*.png
          cp app/build/outputs/roborazzi/*.png "shots/$GITHUB_REF_NAME/"
          cd shots
          git add -A
          git commit -q -m "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" || exit 0
          git push origin screenshots
