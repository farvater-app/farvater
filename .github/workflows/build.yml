name: Проверочная сборка

on:
  push:
    branches: ["**", "!release/**", "!test/**"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Кэш ядра и TUN-моста
        id: natives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/libs/libv2ray.aar
            app/libs/natives-sha256.json
            app/src/main/jniLibs
          key: natives-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/fetch-natives.sh', 'scripts/check-natives.py', 'scripts/native-versions.json', 'scripts/hev-udp-bind.patch') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.sh

      - name: Проверка контрольных сумм нативных частей
        run: python3 scripts/check-natives.py

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.8.2"

      - name: Проверки сборочных контрактов
        run: python3 scripts/test-build-contracts.py

      - name: Ядро для проверки совместимости
        run: python3 scripts/fetch-test-core.py "$RUNNER_TEMP/xray-test"

      - name: Тесты и debug-сборка
        env:
          FARVATER_XRAY_BINARY: ${{ runner.temp }}/xray-test/xray
          FARVATER_XRAY_CONFIG_DIR: ${{ runner.temp }}/xray-configs
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Состав APK
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $(basename "$apk") — $(du -h "$apk" | cut -f1)"
            unzip -l "$apk" | awk '/lib\/.*\.so$/ {print "   " $4 " (" int($1/1024) " КБ)"}'
          done
          listing="$(unzip -l app/build/outputs/apk/debug/*universal*.apk)"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in libgojni.so libhev-socks5-tunnel.so; do
              grep -q "lib/$abi/$lib" <<<"$listing" || { echo "::error::В APK нет $abi/$lib"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !github.event.repository.private }}
        with:
          name: farvater-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Кэш ядра и TUN-моста
        id: natives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            app/libs/libv2ray.aar
            app/libs/natives-sha256.json
            app/src/main/jniLibs
          key: natives-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/fetch-natives.sh', 'scripts/check-natives.py', 'scripts/native-versions.json', 'scripts/hev-udp-bind.patch') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.sh

      - name: Проверка контрольных сумм нативных частей
        run: python3 scripts/check-natives.py

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.8.2"

      - name: Release без подписи
        run: gradle --max-workers=2 :app:assembleRelease

      - name: Конструкторы и рефлексия пережили R8
        run: |
          apk=$(ls app/build/outputs/apk/release/*universal*.apk)
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python3 scripts/check-release-apk.py "$apk" "$build_tools"
