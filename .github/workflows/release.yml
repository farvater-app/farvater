name: Релиз

on:
  push:
    tags: ["v*"]
    branches: ["release/v*", "test/v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - name: Не выпущен ли уже
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx update.json; then
            echo "Релиз $TAG уже выпущен, повторная сборка не нужна"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Версия релиза
        run: echo "TAG=${GITHUB_REF_NAME#*/}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Кэш ядра и TUN-моста
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libv2ray.aar
            app/src/main/jniLibs
          key: natives-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/fetch-natives.sh', 'scripts/hev-udp-bind.patch') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.sh

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.FARVATER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета FARVATER_KEYSTORE_BASE64 — релиз без подписи выпускать нельзя"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FARVATER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Тесты и release-сборка
        env:
          FARVATER_KEYSTORE_PASSWORD: ${{ secrets.FARVATER_KEYSTORE_PASSWORD }}
          FARVATER_KEY_ALIAS: ${{ secrets.FARVATER_KEY_ALIAS }}
          FARVATER_KEY_PASSWORD: ${{ secrets.FARVATER_KEY_PASSWORD }}
        run: >
          gradle :app:testReleaseUnitTest --tests 'app.farvater.ParserTest' :app:assembleRelease
          -PfarvaterVersion=${{ env.TAG }}
          -PfarvaterUpdateRepo=${{ github.repository }}

      - name: Файлы релиза, update.json и отпечаток ключа
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release$/\1/')
            cp "$apk" "dist/Farvater-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in dist/*.apk; do
            files="$(unzip -l "$apk")"
            grep -qE "META-INF/[^/]+\.(RSA|EC|DSA)$" <<<"$files" || { echo "::error::$apk без файлов подписи v1"; exit 1; }
            schemes="$("$APKSIGNER" verify --verbose --min-sdk-version 23 "$apk")"
            for v in v1 v2 v3; do
              grep -q "Verified using $v scheme.*: true" <<<"$schemes" || { echo "::error::$apk не подписан схемой $v"; exit 1; }
            done
          done
          CERT=$("$APKSIGNER" verify --print-certs dist/*universal*.apk | grep -m1 'SHA-256' | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          echo "Отпечаток сертификата: $CERT"
          [[ "$GITHUB_REF_NAME" == test/* ]] && exit 0
          python3 scripts/make-update-json.py "$VERSION" "$GITHUB_REPOSITORY" "$TAG" release-notes.txt dist > dist/update.json
          cat dist/update.json
          {
            echo "Что нового:"
            python3 -c "import json;[print('- '+n) for n in json.load(open('dist/update.json'))['notes']]"
            echo
            echo "Какой файл скачать: почти всем телефонам подходит arm64-v8a. Если не уверены, universal."
            echo
            echo "Отпечаток сертификата подписи (SHA-256): $CERT"
            echo
            echo "Контрольные суммы в файле SHA256SUMS.txt."
          } > dist/NOTES.md
          cat dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        if: ${{ !startsWith(github.ref_name, 'test/') }}
        with:
          name: Фарватер ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/update.json

      - name: Ветка updates
        if: ${{ !startsWith(github.ref_name, 'test/') }}
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin updates; then
            git worktree add -B updates upd FETCH_HEAD
          else
            git worktree add --orphan -b updates upd
          fi
          cp dist/update.json upd/update.json
          cd upd
          git add update.json
          git commit -q -m "update.json ${TAG}" || exit 0
          git push origin updates

      - name: Тестовая сборка в ветку test-build
        if: startsWith(github.ref_name, 'test/')
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --orphan -b test-build tb
          cp dist/*.apk dist/SHA256SUMS.txt tb/
          cd tb
          git add .
          git commit -q -m "Тестовая сборка ${TAG}"
          git push -f origin test-build
